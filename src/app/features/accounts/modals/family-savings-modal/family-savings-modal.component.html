<div class="modal-overlay">
  <div class="modal-backdrop" (click)="close()"></div>

  <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="family-savings-title" (keydown.escape)="close()">
    <div class="modal-header">
      <div>
        <h2 id="family-savings-title">{{ i18n.translate('accounts.familySavingsModalTitle') }}</h2>
        <p class="modal-copy">{{ i18n.translate('accounts.familySavingsModalHint') }}</p>
      </div>

      <button type="button" class="close-button" (click)="close()" [attr.aria-label]="i18n.translate('login.cancel')">✖</button>
    </div>

    <div class="account-list">
      <label class="account-row" *ngFor="let account of accounts()">
        <input
          type="checkbox"
          [checked]="isSelected(account.id)"
          (change)="toggle(account.id, $any($event.target).checked)" />
        <div class="account-copy">
          <strong>{{ account.name }}</strong>
          <span>
            {{ account.ownerUsername }} ·
            {{ account.type === 'CASH' ? i18n.translate('accounts.typeCash') : i18n.translate('accounts.typeSavings') }} ·
            {{ account.balance | number:'1.2-2' }}
          </span>
        </div>
      </label>

      <p class="empty-state" *ngIf="accounts().length === 0">
        {{ i18n.translate('accounts.familySavingsEmpty') }}
      </p>
    </div>

    <p class="error-message" *ngIf="errorMessage()">{{ errorMessage() }}</p>

    <div class="modal-actions">
      <button type="button" class="secondary" (click)="close()">{{ i18n.translate('login.cancel') }}</button>
      <button type="button" class="primary" (click)="save()" [disabled]="isSubmitting()">
        {{ isSubmitting() ? i18n.translate('accounts.processing') : i18n.translate('accounts.familySavingsSave') }}
      </button>
    </div>
  </section>
</div>
